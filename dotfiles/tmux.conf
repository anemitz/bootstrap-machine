# =============================================================================
# tmux.conf — modern defaults for macOS/Linux + Neovim
# =============================================================================

# --- Prefix ---
# Ctrl-a is easier to reach than Ctrl-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- General ---
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"  # true color
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g mouse on
set -g history-limit 50000
set -g base-index 1          # windows start at 1
set -g pane-base-index 1     # panes start at 1
set -g renumber-windows on   # renumber when closing
set -g set-clipboard on
set -g escape-time 0         # no delay for escape (critical for vim)
set -g focus-events on       # for vim autoread
set -g status-interval 5

# --- Windows & Panes ---
# Split with | and - (more intuitive)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Resize panes with vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick reload
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# --- Vim-tmux seamless navigation ---
# Smart pane switching: works across tmux panes AND neovim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Ctrl-l is normally "clear screen" — remap to prefix + l
bind l send-keys 'C-l'

# --- Copy mode (vi style) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "$HOME/.local/bin/clipboard-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "$HOME/.local/bin/clipboard-copy"

# Enter copy mode with prefix + [
bind [ copy-mode

# --- Status bar ---
set -g status-position top
set -g status-style "bg=#1a1b26,fg=#c0caf5"

set -g status-left-length 40
set -g status-left "#[fg=#7aa2f7,bold] #S #[fg=#3b4261]│ "

set -g status-right-length 80
set -g status-right "#[fg=#3b4261]│ #[fg=#9ece6a]󰃰 %H:%M #[fg=#3b4261]│ #[fg=#bb9af7]%b %d "

# Window tabs
set -g window-status-format "#[fg=#3b4261] #I:#W "
set -g window-status-current-format "#[fg=#7dcfff,bold] #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Messages
set -g message-style "bg=#292e42,fg=#c0caf5"

# --- Plugins (via TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'     # auto-save sessions
set -g @plugin 'tmux-plugins/tmux-yank'          # better copy

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'        # restore nvim sessions

# Continuum settings
set -g @continuum-restore 'on'                   # auto-restore on tmux start
set -g @continuum-save-interval '10'             # save every 10 min

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
